<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Cries Of Redemption | Experimental Rock & NuMetal from Savannah, GA
    </title>
    <meta
      name="description"
      content="Cries of Redemption is an experimental rock and NuMetal project by Ed Silva based in Savannah, Georgia. Music first! Music only! Zero gimmicks!"
    />
    <meta
      name="keywords"
      content="Cries of Redemption, Ed Silva, Savannah Georgia rock band, Experimental Rock, NuMetal, Classic Trance, Patterns album"
    />

    <meta
      property="og:title"
      content="Cries Of Redemption | Official Music Site"
    />
    <meta
      property="og:description"
      content="Discover the atmospheric, heavy, and cinematic rock sounds of Ed Silva's project, Cries of Redemption."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.criesofredemptionmusic.com/" />
    <meta
      property="og:image"
      content="https://www.criesofredemptionmusic.com/apple-touch-icon.png"
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Cries Of Redemption | Official Music Site"
    />
    <meta
      name="twitter:description"
      content="Experimental rock and NuMetal project by Ed Silva based in Savannah, Georgia."
    />
    <meta
      name="twitter:image"
      content="https://www.criesofredemptionmusic.com/apple-touch-icon.png"
    />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="canonical" href="https://www.criesofredemptionmusic.com/" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Cries of Redemption",
        "founder": {
          "@type": "Person",
          "name": "Ed Silva"
        },
        "genre": ["Experimental Rock", "NuMetal", "Trance", "Cinematic Trap"],
        "location": {
          "@type": "Place",
          "name": "Savannah, Georgia"
        },
        "url": "https://www.criesofredemptionmusic.com/",
        "sameAs": [
          "https://www.reverbnation.com/criesofredemption",
          "https://criesofredemption.bandcamp.com"
        ]
      }
    </script>
  </head>
  <body class="has-background-black has-navbar-fixed-top">
    <nav class="navbar is-fixed-top has-background-black-bis custom-border-bottom" role="navigation">
  <div class="navbar-brand">
    <!-- The Hamburger Icon -->
    <a role="button" class="navbar-burger has-text-white" aria-label="menu" aria-expanded="false" data-target="mainNav">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div id="mainNav" class="navbar-menu has-background-black-bis py-2" style="box-shadow: none;">
    <div class="navbar-start is-flex-grow-1 is-justify-content-center">
      <a href="#home" class="navbar-item has-text-grey-light px-3 nav-trigger">Home</a>
      <a href="#bio" class="navbar-item has-text-grey-light px-3 nav-trigger">Bio</a>
      <a href="#music" class="navbar-item has-text-grey-light px-3 nav-trigger">Music</a>
      <a href="#videos" class="navbar-item has-text-grey-light px-3 nav-trigger">Videos</a>
      <a href="#photos" class="navbar-item has-text-grey-light px-3 nav-trigger">Photos</a>
      <a href="#press" class="navbar-item has-text-grey-light px-3 nav-trigger">Press</a>
      
      <div class="navbar-item px-3">
        <div class="field has-addons mb-0">
          <div class="control">
            <input class="input is-small is-rounded has-background-black has-text-white custom-border" type="email" placeholder="Join mailing list">
          </div>
          <div class="control">
            <button class="button is-small is-dark is-rounded custom-border">Subscribe</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

    <!-- HOME VIEW: Visible by default -->
    <section
      id="home"
      class="hero is-fullheight-with-navbar is-black view-section"
    >
      <div
        class="hero-body is-flex-direction-column is-justify-content-center is-align-items-center"
      >
        <figure class="image mb-4" style="max-width: 500px; width: 100%">
          <img
            src="assets/images/photo1.jpg"
            alt="Cries of Redemption Official Logo"
          />
        </figure>
        <p
          id="band-tagline"
          class="subtitle is-5 is-uppercase has-text-grey mb-4 has-text-centered"
        ></p>
      </div>
    </section>

    <main class="cr-background container is-max-desktop pb-6 mb-6">
      <!-- BIO VIEW: Hidden by default -->
      <section
        id="bio"
        class="section px-5 pt-6 has-text-centered view-section is-hidden"
        style="min-height: 80vh"
      >
        <h2 class="title is-4 is-uppercase custom-border-bottom pb-2 mb-4">
          Bio
        </h2>
        <div
          id="band-location"
          class="tag is-dark is-rounded mb-4 custom-border"
        ></div>
        <p
          id="band-bio"
          class="content has-text-grey-light mx-auto mb-0"
          style="max-width: 600px"
        ></p>
      </section>

      <!-- MUSIC VIEW: Hidden by default -->
      <div
        id="music"
        class="px-5 pt-6 view-section is-hidden"
        style="min-height: 80vh"
      >
        <section class="section pt-0 px-0">
          <h2 class="title is-5 is-uppercase custom-border-bottom pb-2 mb-4">
            Songs
          </h2>
          <div
            id="song-list"
            class="is-flex is-flex-direction-column"
            style="gap: 8px"
          ></div>
        </section>

        <section class="section pt-0 px-0 mt-6">
          <h2 class="title is-5 is-uppercase custom-border-bottom pb-2 mb-4">
            Albums
          </h2>
          <div
            class="box is-flex is-align-items-center has-background-black-bis custom-border"
            style="gap: 16px"
          >
            <figure class="image is-96x96 m-0">
              <img
                id="album-cover"
                src=""
                alt="Cries of Redemption Album Artwork"
                class="is-rounded"
                style="object-fit: cover"
              />
            </figure>
            <div>
              <div
                id="album-title"
                class="title is-6 mb-1 has-text-white"
              ></div>
              <div
                id="album-subtitle"
                class="subtitle is-7 has-text-grey"
              ></div>
            </div>
          </div>
        </section>
      </div>
      <section
        id="videos"
        class="section pt-6 px-5 view-section is-hidden"
        style="min-height: 80vh"
      >
        <h2 class="title is-5 is-uppercase custom-border-bottom pb-2 mb-4">
          Videos
        </h2>
        <!-- Bulma's column grid will automatically stack these on mobile and sit side-by-side on desktop -->
        <div id="video-grid" class="columns is-multiline"></div>
      </section>
      <!-- PHOTOS VIEW: Hidden by default -->
      <section
        id="photos"
        class="section pt-6 px-5 mb-6 view-section is-hidden"
        style="min-height: 80vh"
      >
        <h2 class="title is-5 is-uppercase custom-border-bottom pb-2 mb-4">
          Photos
        </h2>
        <div id="photo-grid"></div>
      </section>

      <section
        id="press"
        class="section pt-6 px-5 view-section is-hidden"
        style="min-height: 80vh"
      >
        <h2 class="title is-5 is-uppercase custom-border-bottom pb-2 mb-4">
          Press
        </h2>
        <div
          id="press-list"
          class="is-flex is-flex-direction-column"
          style="gap: 16px"
        ></div>
      </section>
    </main>

    <aside class="now-playing-bar has-background-black-bis custom-border-top">
      <div
        class="container is-max-desktop is-flex is-align-items-center is-justify-content-space-between"
        style="gap: 24px; width: 100%"
      >
        <div
          id="now-playing-title"
          class="is-size-6 has-text-weight-semibold has-text-white is-flex-shrink-0"
          style="white-space: nowrap"
        >
          Select a track to play
        </div>
        <div class="is-flex-grow-1">
          <audio id="audio-player" controls controlsList="nodownload"></audio>
        </div>
      </div>
    </aside>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
      const player = new Plyr("#audio-player", {
        controls: ["play", "progress", "current-time", "mute", "volume"],
      });
    </script>
    <script src="player.js"></script>
  </body>
</html>
